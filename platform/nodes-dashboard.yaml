              "expr": "100 * (1 - sum(node_memory_MemAvailable_bytes{job=\"node-exporter\", instance!=\"macbook-pro:9100\"}) / sum(node_memory_MemTotal_bytes{job=\"node-exporter\", instance!=\"macbook-pro:9100\"}))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Memoria clúster"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
