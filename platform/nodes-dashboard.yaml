# Dashboard "Nodos" for Observatory widgets: CPU, memory, network and disk I/O of
# the four cluster nodes (master, worker01-03), from the node_exporter DaemonSet
# that kube-prometheus-stack already runs (job="node-exporter"; the MacBook
# target shares that job and is excluded by instance).
#
# Loaded by the grafana-sc-dashboard sidecar (label grafana_dashboard=1).
# Editing it in Grafana's UI does NOT persist; edit here and kubectl apply.
#
# Layout, top to bottom:
# - cluster summary (CPU/memory over all nodes, Ready nodes, running pods);
# - one panel per metric with one line per node (legend = nodename, joined
#   from node_uname_info so it survives an IP change). Observatory renders
#   these as a multi-line sparkline and shows the FIRST series' value as the
#   headline number, which is the master (lowest instance IP);
# - one gauge per node for CPU and memory, for Small widgets.
# rate() windows are 2m because these targets are scraped every 30s.
# Physical NICs are lan0 (master, worker01/02) and enp1s0 (worker03): the
# queries exclude Calico/VRRP/loopback by name instead of listing them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nodos
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nodos.json: |
    {
      "uid": "nodos-observatory",
      "title": "Nodos",
      "tags": [
        "kubernetes",
        "observatory"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU clúster",
          "type": "gauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{job=\"node-exporter\", instance!=\"macbook-pro:9100\", mode=\"idle\"}[2m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU clúster"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "description": "Uso medio de las 28 CPUs del clúster (4 del master + 8 por worker)."
        },
        {
          "id": 2,
          "title": "Memoria clúster",
          "type": "gauge",
