apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvheadend-config
  namespace: tv
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvheadend-recordings
  namespace: tv
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs          # nfs-subdir sobre 192.168.1.34:/mnt/data20 (20TB)
  resources:
    requests:
      storage: 1Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvheadend
  namespace: tv
  labels:
    app: tvheadend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tvheadend
  template:
    metadata:
      labels:
        app: tvheadend
    spec:
      containers:
      - name: tvheadend
        image: lscr.io/linuxserver/tvheadend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Madrid"
        ports:
        - { name: http, containerPort: 9981 }
        - { name: htsp, containerPort: 9982 }
        volumeMounts:
        - { name: config, mountPath: /config }
        - { name: recordings, mountPath: /recordings }
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      # Sidecar: empuja la EPG (guide.xml.gz de u7d) al socket XMLTV de TVHeadend.
      # Comparte el volumen config -> ve /config/epggrab/xmltv.sock (grabber "External: XMLTV").
      - name: epg-push
        image: nicolaka/netshoot
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "epg-push arrancando; espero a tvheadend/socket..."
          sleep 45
          while true; do
            if curl -fsS --max-time 60 http://192.168.1.40:8888/guide.xml.gz -o /tmp/g.gz; then
              if gunzip -c /tmp/g.gz | socat -T60 - UNIX-CONNECT:/config/epggrab/xmltv.sock; then
                echo "$(date -u) EPG empujada OK ($(wc -c </tmp/g.gz) bytes gz)"
              else
                echo "$(date -u) socat fallo (socket no listo?)"
              fi
            else
              echo "$(date -u) fallo al bajar guide.xml.gz de u7d"
            fi
            sleep 43200   # 12h
          done
        volumeMounts:
        - { name: config, mountPath: /config }
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: tvheadend-config
      - name: recordings
        persistentVolumeClaim:
          claimName: tvheadend-recordings
---
apiVersion: v1
kind: Service
metadata:
  name: tvheadend
  namespace: tv
  labels:
    app: tvheadend
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.14   # UI solo-LAN, como grafana/longhorn
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # preserva la IP real del cliente (sin SNAT) -> el ACL por red funciona
  selector:
    app: tvheadend
  ports:
  - { name: http, port: 9981, targetPort: 9981 }
  - { name: htsp, port: 9982, targetPort: 9982 }
